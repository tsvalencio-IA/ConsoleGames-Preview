name: OTThi - Captura continua 540p - cobertura ampliada
on:
  push:
    branches: ['capture/clipe-otthi-20261125']
    paths: ['.github/workflows/filmagem-continua.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prioridades:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {category: pilot, shard: 0, shards: 1}
          - {category: priority-shops, shard: 0, shards: 4}
          - {category: priority-shops, shard: 1, shards: 4}
          - {category: priority-shops, shard: 2, shards: 4}
          - {category: priority-shops, shard: 3, shards: 4}
          - {category: priority-workshop, shard: 0, shards: 1}
          - {category: places, shard: 0, shards: 8}
          - {category: places, shard: 1, shards: 8}
          - {category: places, shard: 2, shards: 8}
          - {category: places, shard: 3, shards: 8}
          - {category: places, shard: 4, shards: 8}
          - {category: places, shard: 5, shards: 8}
          - {category: places, shard: 6, shards: 8}
          - {category: places, shard: 7, shards: 8}
          - {category: npcs, shard: 0, shards: 4}
          - {category: npcs, shard: 1, shards: 4}
          - {category: npcs, shard: 2, shards: 4}
          - {category: npcs, shard: 3, shards: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar ambiente de captura
        run: |
          python3 games/otthi/tools/build_project.py
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          node --check tools/filmagem/diretor-continuo.mjs
      - name: Filmar cenas prioritarias sem PNG por quadro
        env:
          FILM_CATEGORY: ${{ matrix.category }}
          FILM_SHARD: ${{ matrix.shard }}
          FILM_SHARDS: ${{ matrix.shards }}
        run: node tools/filmagem/diretor-continuo.mjs
      - name: Salvar MP4 concluidos e cobertura mesmo com falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CONTINUA-540-${{ matrix.category }}-${{ matrix.shard }}
          path: |
            filmagem-continua/**/*.mp4
            filmagem-continua/**/*.json
            !filmagem-continua/**/*.tmp.mp4
          if-no-files-found: error
          retention-days: 14
