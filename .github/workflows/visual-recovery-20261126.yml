name: OTThi - Recuperacao visual sem regressao
on:
  push:
    branches: ['fix/otthi-visual-recovery-20261126']
    paths: ['.github/workflows/visual-recovery-20261126.yml', 'games/otthi/src/modules/**', 'tests/player-regressions.test.mjs', 'tests/world-render-stability*.mjs', 'tests/world-play-performance.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar e testar geometria
        run: |
          python3 games/otthi/tools/build_project.py
          node --check tests/world-render-stability-browser.mjs
          node --test tests/world-render-stability.test.mjs
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Comparar quadros reais de represa aeroporto e serra
        env:
          OT_RENDER_BASELINE: a791268ec4486520bb2c43fcc02c0cdadaac9c43
        run: node tests/world-render-stability-browser.mjs
      - name: Validar embarque voo e pouso reais
        run: node tests/world-airport-balloon-browser.mjs
      - name: Validar seleção por toque e teclado no mapa do metrô e baldeação física
        run: node tests/world-metro-itinerary-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-stability-visual
          path: |
            test-results/render-stability/
            test-results/world-airport/
            test-results/world-metro-itinerary/
  desempenho:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar e testar runtime integral
        run: |
          python3 games/otthi/tools/build_project.py
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          node --test tests/*.test.mjs
      - name: Comparar jogo em movimento e rotacao da camera
        env:
          OT_LIVE_BASELINE: a791268ec4486520bb2c43fcc02c0cdadaac9c43
          OT_LIVE_QUALITY: auto
          OT_LIVE_SECONDS: '20'
          OT_LIVE_TURN: '1'
          OT_LIVE_ZOOM: '1'
          OT_LIVE_PROFILE: '1'
          OT_LIVE_SHADERS: '1'
          OT_LIVE_REQUIRE_COMPARISON: '1'
          OT_LIVE_STRICT_FRAME: '1'
          OT_LIVE_OUT: test-results/world-live-performance
        run: node tests/world-play-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-stability-performance
          path: test-results/world-live-performance/
  servicos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar pacote e navegador
        id: preparar
        run: |
          python3 games/otthi/tools/build_project.py
          git diff --exit-code -- games/otthi
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Conferir abastecimento físico e persistência no posto
        run: node tests/world-station-fuel-browser.mjs
      - name: Conferir socorro de combustível solicitado pelo celular
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: node tests/world-phone-fuel-browser.mjs
      - name: Conferir Jornada, rotação e persistência de recompensas
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: node tests/world-player-journey-browser.mjs
      - name: Acompanhar trânsito, entregas e socorro por quinze minutos
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        env:
          OT_ENDURANCE_CASE: both
          OT_ENDURANCE_BASELINE: a791268ec4486520bb2c43fcc02c0cdadaac9c43
          OT_ENDURANCE_SECONDS: '900'
          OT_ENDURANCE_RESIDENTS_BEFORE: '208'
          OT_ENDURANCE_RESIDENTS_AFTER: '208'
        run: node tests/world-native-endurance-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otthi-servicos-e-sessao-prolongada
          path: |
            test-results/station-fuel/
            test-results/phone-fuel/
            test-results/world-player-journey/
            test-results/world-native-endurance/
