name: OTThi - validar correcoes NPC e HUD antes de publicar
on:
  push:
    branches: [fix/otthi-npc-hud-20261124, fix/otthi-mapa-integridade-20261124]
permissions:
  contents: write
  actions: write
concurrency:
  group: npc-hud-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'tsvalencio-IA/ConsoleGames-Preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real modular World
        run: python3 games/otthi/tools/build_project.py
      - name: Regression and static suite
        run: |
          node --check games/otthi/app.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Package isolated site
        run: python3 tools/build-github-pages-preview.py
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Verify park bridge, running course and real purchases
        if: github.ref_name == 'fix/otthi-mapa-integridade-20261124'
        run: node tests/rio-park-integrity-browser.mjs
      - name: Verify mobile menu and all eight routes
        run: node tests/pages-preview-browser.mjs
      - name: Verify real regional interiors and chalet ownership
        run: node tests/rio-regional-interiors-browser.mjs
      - name: Validate native compact world, including jet ski
        if: github.ref_name == 'fix/otthi-mapa-integridade-20261124' && startsWith(github.event.head_commit.message, 'release(otthi):')
        run: node tests/rio-compact-world-browser.mjs
      - name: Store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-hud-eight-games
          path: |
            test-results/pages-preview/
            test-results/rio-regional-interiors/
            test-results/rio-park-integrity/
            test-results/rio-compact-world/
          if-no-files-found: ignore
      - name: Wait for both independent gameplay validations on the exact requested revision
        if: github.ref_name == 'fix/otthi-mapa-integridade-20261124' && startsWith(github.event.head_commit.message, 'release(otthi):')
        uses: actions/github-script@v8
        with:
          script: |
            const names = ['Validar gameplay real no Chromium','Câmera frontal e modos no mundo OT'];
            const {owner,repo}=context.repo;
            for(let attempt=0;attempt<180;attempt++){
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({owner,repo,head_sha:context.sha,per_page:100});
              const runs=names.map(name=>data.workflow_runs.filter(r=>r.name===name&&r.head_sha===context.sha).sort((a,b)=>b.id-a.id)[0]);
              if(runs.some(r=>r?.status==='completed'&&r.conclusion!=='success')) throw Error('Independent validation failed or was cancelled: '+JSON.stringify(runs.map(r=>r&&[r.name,r.conclusion])));
              if(runs.every(r=>r?.status==='completed'&&r.conclusion==='success')) return;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw Error('Independent validation did not complete');
      - name: Record generated runtime after all checks
        run: |
          git config user.name 'ConsoleGames validation'
          git config user.email 'console-validation@users.noreply.github.com'
          git add games/otthi/app.js games/otthi/style.css games/otthi/sw.js games/otthi/index.html games/otthi/release-manifest.json games/otthi/src/module-order.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(otthi): synchronize validated NPC and HUD runtime'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Package complete validated source and website
        if: github.ref_name == 'fix/otthi-mapa-integridade-20261124' && startsWith(github.event.head_commit.message, 'release(otthi):')
        run: |
          mkdir -p /tmp/otthi-release
          git archive --format=zip --output=/tmp/otthi-release/ConsoleGames-source.zip HEAD
          (cd _pages_preview && zip -qr /tmp/otthi-release/ConsoleGames-site.zip .)
          git rev-parse HEAD > /tmp/otthi-release/REVISION.txt
          (cd /tmp/otthi-release && sha256sum *.zip > SHA256SUMS.txt)
      - name: Upload complete validated downloads
        if: github.ref_name == 'fix/otthi-mapa-integridade-20261124' && startsWith(github.event.head_commit.message, 'release(otthi):')
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleGames-release-validated
          path: /tmp/otthi-release/
          if-no-files-found: error
      - name: Promote only the validated revision to the existing preview main
        if: github.ref_name == 'fix/otthi-mapa-integridade-20261124' && startsWith(github.event.head_commit.message, 'release(otthi):')
        run: |
          git fetch origin main "${GITHUB_REF_NAME}"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/main
      - name: Dispatch existing verified Pages publisher
        if: github.ref_name == 'fix/otthi-mapa-integridade-20261124' && startsWith(github.event.head_commit.message, 'release(otthi):')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-isolated-pages-preview.yml --ref main --repo "$GITHUB_REPOSITORY"
