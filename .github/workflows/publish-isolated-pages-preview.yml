name: GitHub Pages - OTThi isolated preview

# This workflow is intentionally inactive on ConsoleGames.  It can publish
# only after the tested branch is copied to main of a SEPARATE preview repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: otthi-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.repository == 'tsvalencio-IA/ConsoleGames-Preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the authentic OTThi runtime
        run: python3 games/otthi/tools/build_project.py

      - name: Validate generated game
        run: |
          node --check games/otthi/app.js
          node --test tests/rio-compact-layout.test.mjs tests/rio-wardrobe.test.mjs tests/world-integrity.test.mjs tests/otthi-simulator-commerce.test.mjs tests/world-light-budget.test.mjs tests/world-pedestrian-navigation.test.mjs tests/world-physical-rescue.test.mjs tests/kart-racecraft.test.mjs tests/war-camera-body-only.test.mjs tests/world-traffic-flow.test.mjs
          git diff --exit-code -- games/otthi
          git diff --check

      - name: Prepare isolated GitHub Pages paths
        run: python3 tools/build-github-pages-preview.py

      - name: Verify the final mounted artifact in Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium --with-deps
          node tests/pages-preview-browser.mjs

      - name: Prepare the requested isolated 705.28.54 playtest
        run: |
          set -euo pipefail
          git fetch origin refs/heads/fix/otthi-visual-recovery-20261126
          git merge-base --is-ancestor 65484d1f70b8d7df12e9149f9decbba1063c6c3b FETCH_HEAD
          git worktree add --detach "$RUNNER_TEMP/otthi-54" 65484d1f70b8d7df12e9149f9decbba1063c6c3b
          python3 tools/append-otthi-playtest.py "$RUNNER_TEMP/otthi-54" _pages_preview
          node tests/pages-candidate-54-browser.mjs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        id: archive
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _pages_preview

      - name: Publish the verified artifact by ID
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.archive.outputs.artifact_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error('The upload did not return a Pages artifact ID.');
            }
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 1; ; attempt++) {
              try {
                await github.rest.actions.getArtifact({owner, repo, artifact_id: artifactId});
                break;
              } catch (error) {
                if (error.status !== 404 || attempt === 18) throw error;
                await sleep(5000);
              }
            }
            const release = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifactId, pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            const deploymentId = release.data.id || context.sha;
            core.info(`Publishing artifact ${artifactId} as deployment ${deploymentId}.`);
            const failed = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 120; attempt++) {
              await sleep(5000);
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner, repo, deploymentId
              });
              if (data.status === 'succeed') return;
              if (failed.has(data.status)) throw new Error('Pages returned ' + data.status);
            }
            throw new Error('Pages did not confirm the deployment within ten minutes.');

      - name: Verify the published Pages URL and commit
        env:
          OT_PAGES_URL: ${{ steps.pages.outputs.base_url }}/
          OT_PAGES_OUT: test-results/pages-published
        run: node tests/pages-preview-browser.mjs

      - name: Verify the isolated published playtest
        env:
          OT_PAGES_URL: ${{ steps.pages.outputs.base_url }}/
          OT_PLAYTEST_OUT: test-results/pages-candidate-54-published
        run: node tests/pages-candidate-54-browser.mjs

      - name: Store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-browser-evidence
          path: |
            test-results/pages-preview/
            test-results/pages-published/
            test-results/pages-candidate-54/
            test-results/pages-candidate-54-published/
          if-no-files-found: ignore
