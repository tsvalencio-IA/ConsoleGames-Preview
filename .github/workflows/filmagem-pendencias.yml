name: OTThi - Aeronaves e oficina - retomada direcionada
on:
  push:
    branches: ['capture/clipe-otthi-20261125']
    paths: ['.github/workflows/filmagem-pendencias.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cenas:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        category: [voo-plane, voo-helicopter, voo-balloon, oficina]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar captura
        run: |
          python3 games/otthi/tools/build_project.py
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          node --check tools/filmagem/pendencias.mjs
      - name: Executar acoes e salvar quadros reais
        env:
          FILM_CATEGORY: ${{ matrix.category }}
        run: node tools/filmagem/pendencias.mjs
      - name: Exportar somente videos finalizados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PENDENCIAS-${{ matrix.category }}
          path: |
            filmagem-pendencias/**/*.mp4
            filmagem-pendencias/**/*.json
            !filmagem-pendencias/**/*.tmp.mp4
          if-no-files-found: error
          retention-days: 14
