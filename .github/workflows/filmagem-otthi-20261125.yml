name: Filmagem OTThi - gameplay para clipe
# Execução de captura isolada; não publica nem modifica o jogo.
on:
  push:
    branches: ['capture/clipe-otthi-20261125']
    paths: ['.github/workflows/filmagem-otthi-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recuperar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45650986588
          path: originais
      - name: Recuperar vídeos originais válidos e converter sem repetir a jogabilidade
        shell: bash
        run: |
          mkdir -p recuperados
          find originais -name '*.webm' -print0 | while IFS= read -r -d '' video; do
            rel="${video#originais/}"
            dst="recuperados/${rel%.webm}.mp4"
            mkdir -p "$(dirname "$dst")"
            if ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video" | grep -q .; then
              ffmpeg -nostdin -hide_banner -loglevel error -y -i "$video" -c:v libx264 -preset fast -crf 20 -vf 'pad=ceil(iw/2)*2:ceil(ih/2)*2' -pix_fmt yuv420p -movflags +faststart "$dst" || { rm -f "$dst"; continue; }
              echo "$rel" >> recuperados/videos-recuperados.txt
            fi
          done
          find recuperados -name '*.mp4' -size +0c | grep -q .
          echo 'Gravações da primeira execução. Podem conter trechos incompletos; não equivalem a aprovação de todos os roteiros.' > recuperados/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 00-Videos-originais-recuperados
          path: recuperados/
          if-no-files-found: error
          retention-days: 14
  filmar:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - capitulo: 01-Ferrari-compra-interior
            scripts: 'tests/filmagem-ferrari.mjs'
          - capitulo: 02-Oficina-missoes-policia-bombeiros
            scripts: 'tests/rio-city-services-browser.mjs'
          - capitulo: 03-Aviao-helicoptero-balao
            scripts: 'tests/vehicle-orbit-browser.mjs tests/balloon-photo-browser.mjs'
          - capitulo: 04-Casas-comercio-mansoes-hoteis
            scripts: 'tests/rio-compact-world-browser.mjs'
          - capitulo: 05-Fotografos-corrida-parque
            scripts: 'tests/rio-park-integrity-browser.mjs'
          - capitulo: 09-Compras-entregas-garagem
            scripts: 'tests/world-fleet-garage-browser.mjs'
          - capitulo: 10-Modos-OT-Games
            scripts: 'tests/ot-games-browser.mjs'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar versão isolada
        run: python3 games/otthi/tools/build_project.py
      - name: Instalar ferramentas de gravação
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Servir jogo local no servidor GitHub
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/filmagem-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Verificar gravador antes de iniciar o jogo
        run: |
          node --check tools/filmagem/record.mjs
          node --check tests/filmagem-ferrari.mjs
          node tools/filmagem/record.mjs tests/filmagem-preflight.mjs
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 filmagem/filmagem-preflight/cena-01.webm | grep -q .
          rm -rf filmagem/filmagem-preflight
      - name: Jogar e gravar em modo independente
        env:
          ARCADE_QA_LAYOUTS: landscape-844,portrait
          ARCADE_QA_GUEST: '1'
        run: |
          mkdir -p filmagem
          git rev-parse HEAD > filmagem/REVISAO.txt
          status=0
          for script in ${{ matrix.scripts }}; do
            echo "Gravando $script"
            node tools/filmagem/record.mjs "$script" || status=1
          done
          exit "$status"
      - name: Converter para MP4 para edição
        if: always()
        run: |
          if command -v ffmpeg >/dev/null; then
            find filmagem -name 'cena-*.webm' -print0 | while IFS= read -r -d '' video; do
              ffmpeg -nostdin -hide_banner -loglevel error -y -i "$video" -c:v libx264 -preset fast -crf 20 -vf 'pad=ceil(iw/2)*2:ceil(ih/2)*2' -pix_fmt yuv420p -movflags +faststart "${video%.webm}.mp4" || true
            done
          fi
      - name: Baixar cenas e evidências mesmo se houver erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.capitulo }}
          path: |
            filmagem/
            test-results/**/result.json
            test-results/**/failure.json
            test-results/**/failure.png
          if-no-files-found: warn
          retention-days: 14
